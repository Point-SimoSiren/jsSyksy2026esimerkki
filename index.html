<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ping Pong Fury</title>
    
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <main>
        <h1>Ping Pong Fury Game</h1>

        <!-- Tyyliteema dropdown -->
        <label for="theme-select">Choose a theme:</label>
        <select id="theme-select">
            <option value="default">Ocean</option>
            <option value="sunset">Sunset</option>
            <option value="forest">Forest</option>
            <option value="dark">Dark</option>
        </select>

        <!-- Painikkeet näyttävät sivun muun sisällön samaan alueeseen. -->
        <div>
            <button>Downloads</button>

            <button onclick="history()">History of PPF</button>
            <button onclick="support()">Support</button>
        </div>

        <div id="root"></div>
    </main>

    <!-- Skripti on sijoitettu ulkoiseen koodi.js-tiedostoon. -->
     <script src="koodi.js">
        
     </script>

</body>
</html>
